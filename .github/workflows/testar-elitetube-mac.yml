name: Testar o EliteTube no Mac (video inteiro)

# Gera um video DE VERDADE num Mac Apple Silicon, com o MESMO .dmg que o Membro baixa:
# instala o motor de imagem e o de clonagem pelo proprio programa, grava uma voz de teste
# (como o "Gravar minha voz") e pede um video, do jeito que a tela pede. Nasceu do caso
# Edgard (MacBook M4, 08/11/2026): na 4.0.3 veio "nao consegui montar o video".
#
# ATUALIZAR POR CIMA (09/11/2026). A rodada 4 fez o video inteiro com o programa recem
# instalado. O Edgard NAO estava nesse caso: ele instalou os motores numa versao e depois
# trocou o EliteTube.app pela versao nova. Com `atualizar = sim` o teste faz exatamente
# isso: instala os motores, fecha o programa, apaga o .app e poe o do `dmg_novo` no lugar.

on:
  # dispara sozinho quando este arquivo chega ao repositorio (sem precisar do botao)
  push:
    branches: [main]
    paths: [".github/workflows/testar-elitetube-mac.yml"]
  workflow_dispatch:
    inputs:
      dmg:
        description: "Endereco do .dmg instalado primeiro (onde os motores sao baixados)"
        required: true
        default: "https://loja.eliteaisolutions.app.br/storage/updates/elitetube/EliteTube-latest-mac.dmg"
      dmg_novo:
        description: "Endereco do .dmg que entra POR CIMA (vazio = o mesmo)"
        required: false
        default: ""
      atualizar:
        description: "Atualizar o programa por cima depois de instalar os motores (sim/nao)"
        required: true
        default: "sim"
      voz:
        description: "Voz: minha (gravada, clonagem) ou local"
        required: true
        default: "minha"

env:
  DMG1: ${{ inputs.dmg || 'https://loja.eliteaisolutions.app.br/storage/updates/elitetube/EliteTube-latest-mac.dmg' }}
  DMG2: ${{ inputs.dmg_novo || 'https://github.com/teotonioleite001-lgtm/whisper-mac-build/releases/download/ponte/EliteTube-4.0.4-arm64.dmg' }}
  ATUALIZAR: ${{ inputs.atualizar || 'sim' }}
  VOZ: ${{ inputs.voz || 'minha' }}

jobs:
  e2e:
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 300
    # OS DOIS CASOS REAIS DE MEMBRO DE MAC (09/11/2026), os dois instalando na 4.0.3 e
    # atualizando por cima para a nova:
    #  voz    = o caso Edgard: voz gravada, motor de clonagem instalado na versao velha.
    #  imagem = quem instalou o motor SD na 4.0.3 (o torch foi parar dentro do .app).
    strategy:
      fail-fast: false
      matrix:
        include:
          - cenario: voz
            motor: leve
            paragrafos: "4"
          - cenario: imagem
            motor: sd15
            paragrafos: "2"
    env:
      CENARIO: ${{ matrix.cenario }}
      MOTOR: ${{ matrix.motor }}
      PARAGRAFOS: ${{ matrix.paragrafos }}
      CONSERTO: "nao"

    steps:
      - name: Maquina
        run: |
          mkdir -p /tmp/e2e
          exec > >(tee -a /tmp/e2e/passos.txt) 2>&1
          sysctl -n machdep.cpu.brand_string || true
          sysctl hw.ncpu hw.memsize 2>/dev/null || true
          sw_vers
          df -h / | tail -1
          echo "dmg1=$DMG1"; echo "dmg2=$DMG2"; echo "cenario=$CENARIO atualizar=$ATUALIZAR motor=$MOTOR voz=$VOZ paragrafos=$PARAGRAFOS conserto=$CONSERTO"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Escrever o instalador do .app (o mesmo para instalar e para atualizar)
        run: |
          cat > /tmp/instalar-app.sh <<'SH'
          #!/bin/bash
          # Poe o EliteTube.app de um .dmg no lugar do que houver, como o Membro faz ao
          # atualizar: o .app velho sai INTEIRO e o novo entra. Os dados (motores, vozes,
          # projetos) ficam em ~/Library/Application Support/EliteTube e nao sao tocados.
          set -euo pipefail
          URL="$1"
          curl -fsSL --retry 3 -o /tmp/et.dmg "$URL"
          ls -la /tmp/et.dmg
          shasum -a 256 /tmp/et.dmg
          hdiutil attach -nobrowse -readonly -mountpoint /Volumes/ET /tmp/et.dmg >/dev/null
          rm -rf "$HOME/EliteTube.app"
          cp -R /Volumes/ET/*.app "$HOME/EliteTube.app"
          hdiutil detach /Volumes/ET >/dev/null
          rm -f /tmp/et.dmg
          echo "versao: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$HOME/EliteTube.app/Contents/Info.plist")"
          M="$HOME/EliteTube.app/Contents/Resources/app/main.js"
          sed -i "" "s/const EXIGIR_LICENCA = true;/const EXIGIR_LICENCA = false;/" "$M"
          grep -n "const EXIGIR_LICENCA" "$M"
          # CONSERTO EM TESTE (09/11): so faz efeito na 4.0.3; na 4.0.4 o fonte ja vem certo
          I="$HOME/EliteTube.app/Contents/Resources/app/engine-node/instalar-motor-imagem.js"
          if [ "$CONSERTO" = "sim" ]; then
            sed -i "" "s/fs.cpSync(_emb, pyDir, { recursive: true, force: true });/fs.cpSync(_emb, pyDir, { recursive: true, force: true, verbatimSymlinks: true });/" "$I"
          fi
          grep -n "fs.cpSync(_emb" "$I" || true
          codesign --force --deep --sign - "$HOME/EliteTube.app" >/dev/null 2>&1 && echo "reassinado (ad-hoc) so neste Mac de teste"
          SH
          chmod +x /tmp/instalar-app.sh
          cat > /tmp/abrir-app.sh <<'SH'
          #!/bin/bash
          # Fecha o que houver aberto e abre o EliteTube; espera o servidor da tela responder.
          pkill -f "EliteTube.app/Contents/MacOS/EliteTube" || true; sleep 5
          pkill -9 -f "EliteTube.app/Contents" || true; sleep 2
          nohup "$HOME/EliteTube.app/Contents/MacOS/EliteTube" >> /tmp/app.out 2>&1 &
          for i in $(seq 1 150); do
            if curl -sf -o /dev/null http://127.0.0.1:47615/gerar_status; then echo "servidor no ar em ~$((i*2)) s"; exit 0; fi
            sleep 2
          done
          echo "O MOTOR NAO SUBIU"; ps aux | grep -i elitetube | grep -v grep | head; tail -n 60 /tmp/app.out
          tail -n 80 "$HOME/Library/Application Support/EliteTube/elitetube.log" 2>/dev/null
          exit 1
          SH
          chmod +x /tmp/abrir-app.sh
          cat > /tmp/olhar-motor-voz.sh <<'SH'
          #!/bin/bash
          # Para onde aponta o python do motor de voz, e se ele abre as bibliotecas da clonagem.
          V="$HOME/Library/Application Support/EliteTube/motor-voz"
          [ -d "$V/python" ] || { echo "(sem $V/python)"; exit 0; }
          ls -la "$V/python" | head -8
          ls -la "$V/python/bin" | grep -E " python" | head -4
          P="$V/python/bin/python3"
          echo "realpath: $(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$P" 2>/dev/null)"
          "$P" -c "import sys, tokenizers, soxr, onnxruntime; print('IMPORTA OK  prefix=' + sys.prefix)" 2>&1 | tail -2 || true
          SH
          chmod +x /tmp/olhar-motor-voz.sh
          cat > /tmp/olhar-motor-imagem.sh <<'SH'
          #!/bin/bash
          # Para onde aponta o python do motor de imagem, e se ele abre o torch de dentro da pasta dele.
          M="$HOME/Library/Application Support/EliteTube/motor-imagem"
          [ -d "$M/python" ] || { echo "(sem $M/python)"; exit 0; }
          P="$M/python/bin/python3"
          echo "realpath: $(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$P" 2>/dev/null)"
          "$P" -c "import sys, torch; print('TORCH OK  prefix=' + sys.prefix + '  torch=' + torch.__file__)" 2>&1 | tail -2 || true
          SH
          chmod +x /tmp/olhar-motor-imagem.sh
          echo ok

      - name: Baixar e instalar o EliteTube (o mesmo .dmg da area de membros)
        run: |
          exec > >(tee -a /tmp/e2e/passos.txt) 2>&1
          /tmp/instalar-app.sh "$DMG1"

      - name: Gravar a voz de teste (igual ao "Gravar minha voz")
        run: |
          exec > >(tee -a /tmp/e2e/passos.txt) 2>&1
          set -euo pipefail
          D="$HOME/Library/Application Support/EliteTube/engine/minhas-vozes"
          mkdir -p "$D"
          V=Luciana
          say -v '?' | grep -q '^Luciana' || V=$(say -v '?' | grep -m1 'pt_BR' | awk '{print $1}')
          echo "voz do sistema: $V"
          say -v "$V" -o /tmp/voz.aiff "Olá, este é um teste de gravação da minha voz para o programa. Eu estou falando de forma natural e com calma, para que a clonagem capture o meu timbre, o meu ritmo e a minha entonação. Vamos ver como fica a narração com a minha própria voz."
          afconvert -f WAVE -d LEI16@24000 -c 1 /tmp/voz.aiff "$D/teste.wav"
          printf '{"nome":"Voz Teste","segundos":14,"criada":"2026-11-09T00:00:00.000Z"}' > "$D/teste.json"
          ls -la "$D"

      - name: Abrir o EliteTube
        run: |
          exec > >(tee -a /tmp/e2e/passos.txt) 2>&1
          set -euo pipefail
          /tmp/abrir-app.sh
          curl -sf http://127.0.0.1:47615/vozes > /tmp/vozes.json
          node -e 'const d=require("/tmp/vozes.json"); const v=d.vozes||d; console.log(v.length,"vozes"); for (const x of v) if (x.minha || /local/.test(x.nome||"")) console.log("  "+x.id+" | "+(x.nome||"")+(x.minha?" | MINHA":""))'

      - name: Escrever o roteiro de teste e o piloto
        run: |
          mkdir -p /tmp/e2e
          cat > /tmp/e2e/piloto.js <<'JS'
          // Fala com o EliteTube pelo MESMO endereco que a tela usa.
          const http = require('http');
          const MOTOR = process.env.MOTOR || 'leve', VOZ = process.env.VOZ || 'minha', FASE = process.argv[2];
          const PARAGRAFOS = Math.max(1, Math.min(12, parseInt(process.env.PARAGRAFOS, 10) || 12));
          const t0 = Date.now(), min = () => ((Date.now() - t0) / 60000).toFixed(1).padStart(5) + ' min';
          function req(m, p, b) { return new Promise(ok => {
            const d = b ? Buffer.from(JSON.stringify(b)) : null;
            const r = http.request({ host: '127.0.0.1', port: 47615, path: p, method: m, timeout: 30000,
              headers: d ? { 'Content-Type': 'application/json', 'Content-Length': d.length } : {} }, res => {
              let s = ''; res.on('data', c => s += c);
              res.on('end', () => { try { ok(JSON.parse(s)); } catch (e) { ok({ _cru: s.slice(0, 300) }); } }); });
            r.on('error', e => ok({ _erro: e.message })); r.on('timeout', () => { r.destroy(); ok({ _erro: 'timeout' }); });
            if (d) r.write(d); r.end(); }); }
          const espera = ms => new Promise(s => setTimeout(s, ms));
          async function motores() {
            if (VOZ === 'minha') console.log(min(), 'pedi o motor de clonagem:', JSON.stringify(await req('POST', '/baixar_motor_clone', {})));
            if (MOTOR === 'sd15') console.log(min(), 'pedi o motor de imagem:', JSON.stringify(await req('POST', '/baixar_motor_img', { motor: 'sd15' })));
            let ult = '';
            for (;;) {
              await espera(15000);
              const c = VOZ === 'minha' ? await req('GET', '/motor_clone_status') : { presente: true };
              const i = MOTOR === 'sd15' ? await req('GET', '/baixar_motor_img_status?motor=sd15') : {};
              const s = MOTOR === 'sd15' ? await req('GET', '/motor_img_status?motor=sd15') : { instalado: true };
              const lc = 'clonagem: ' + (c.rodando ? 'baixando' : (c.presente ? 'PRONTO' : 'parado')) + (c.erro ? ' ERRO ' + c.erro : '');
              const li = 'imagem: ' + (i.rodando ? 'baixando ' + JSON.stringify(i).slice(0, 140) : (s.instalado ? 'PRONTO' : 'parado')) + (i.erro ? ' ERRO ' + i.erro : '');
              if (lc + li !== ult) { console.log(min(), lc, '|', li); ult = lc + li; }
              // na 4.0.3 o motor SD instala e NUNCA aparece "instalado" (o torch foi para dentro do
              // .app); o fim da instalacao e o arquivo de status dizendo pronto
              if ((VOZ !== 'minha' || (c.presente && !c.rodando)) && (MOTOR !== 'sd15' || (!i.rodando && (s.instalado || i.pronto === true)))) { console.log(min(), 'MOTORES PRONTOS', '| imagem instalado=' + s.instalado); return 0; }
              if ((c.erro && !c.rodando) || (i.erro && !i.rodando)) { console.log(min(), 'A INSTALACAO FALHOU'); return 2; }
              if (Date.now() - t0 > 100 * 60000) { console.log(min(), 'a instalacao passou de 100 min'); return 3; }
            }
          }
          // O MOTOR QUE A ATUALIZACAO QUEBROU (4.0.4): o primeiro Gerar dispara o conserto. No
          // motor de imagem ele avisa "esta sendo reconectado" e pede para gerar de novo; aqui o
          // piloto faz o que o Membro faria: espera o cartao ficar pronto e manda gerar outra vez.
          async function gerar() {
            let r = await umaGeracao();
            if (r && r.reconectando) {
              console.log(min(), 'o programa esta reconectando o motor; esperando como o Membro esperaria');
              let ult = '';
              for (let k = 0; k < 240; k++) {
                await espera(15000);
                const s = await req('GET', '/motor_img_status?motor=' + MOTOR);
                const i = await req('GET', '/baixar_motor_img_status?motor=' + MOTOR);
                const c = await req('GET', '/motor_clone_status');
                const l = 'imagem instalado=' + s.instalado + ' rodando=' + i.rodando + ' ' + (i.etapa || '') + ' | voz presente=' + c.presente + ' rodando=' + c.rodando;
                if (l !== ult) { console.log(min(), l); ult = l; }
                if (s.instalado && !i.rodando) break;
                if (i.erro && !i.rodando) { console.log(min(), 'o conserto do motor de imagem falhou:', i.erro); return 7; }
              }
              r = await umaGeracao();
            }
            return r && typeof r.codigo === 'number' ? r.codigo : 9;
          }
          async function umaGeracao() {
            const v = await req('GET', '/vozes'); const vozes = (v && v.vozes) || [];
            const voz = VOZ === 'minha' ? vozes.find(x => x.minha) : (vozes.find(x => x.padrao && !x.minha && !x.bloqueada) || vozes.find(x => !x.minha && !x.bloqueada));
            if (!voz) { console.log('nao achei a voz', VOZ); return { codigo: 4 }; }
            console.log(min(), 'voz:', voz.id, '|', voz.nome, '| motor de imagem:', MOTOR, '| paragrafos:', PARAGRAFOS);
            const roteiro = [
              'Você já parou para pensar quanto tempo perde todos os dias com tarefas repetitivas?',
              'Hoje eu vou mostrar três hábitos simples que mudam completamente a sua produtividade.',
              'O primeiro hábito é planejar o dia na noite anterior, com calma e sem pressa.',
              'Quando você acorda sabendo o que fazer, a manhã rende muito mais.',
              'O segundo hábito é fazer primeiro a tarefa mais difícil do dia.',
              'Com a energia alta, o que parecia impossível fica bem mais leve.',
              'O terceiro hábito é desligar as notificações enquanto você trabalha.',
              'Cada interrupção custa minutos preciosos para recuperar a concentração.',
              'Junte esses três hábitos e observe a diferença em uma semana.',
              'Você vai terminar o dia com mais tempo e menos cansaço.',
              'Comece hoje mesmo, com um hábito de cada vez.',
              'E me conte nos comentários qual deles você vai testar primeiro.',
            ].slice(0, PARAGRAFOS).join('\n\n');
            const g = await req('POST', '/gerar', { roteiro, audio: 'elitetube', vertical: false, quadrado: false, estilo: '',
              legenda: 'elite', motor_img: MOTOR, mistura: null, reusar_imagens: false, voz: voz.id, modo: null, avatar: null, transicao: '' });
            console.log(min(), '/gerar:', JSON.stringify(g).slice(0, 300));
            if (g && g.ok === false) return { codigo: 5 };
            let ultima = '', fim = null;
            for (let k = 0; k < 2400; k++) {           // ate 200 min
              await espera(5000);
              const s = await req('GET', '/gerar_status'); if (s._erro) continue;
              const e = s.etapa || '';
              if (e && e !== ultima) { console.log(min(), 'TELA:', e); ultima = e; }
              if (!s.gerando && k > 2) { fim = s; break; }
            }
            console.log(min(), '=== FIM ===');
            if (!fim) { console.log('nao terminou em 200 min'); return { codigo: 6 }; }
            console.log('erro :', fim.erro || '(nenhum)'); console.log('aviso:', fim.aviso || '(nenhum)'); console.log('video:', fim.ultimo || '(nenhum)');
            if (fim.erro && /reconectad/i.test(fim.erro)) return { reconectando: true };
            return { codigo: (fim.ultimo && !fim.erro) ? 0 : 1 };
          }
          (FASE === 'motores' ? motores() : gerar()).then(c => process.exit(c)).catch(e => { console.log('piloto quebrou:', e); process.exit(9); });
          JS
          echo ok

      - name: Instalar os motores pelo proprio programa
        run: |
          exec > >(tee -a /tmp/e2e/passos.txt) 2>&1
          node /tmp/e2e/piloto.js motores
          echo "=== o python do motor de voz, recem instalado"
          /tmp/olhar-motor-voz.sh

      - name: Atualizar o programa por cima (como o Membro faz)
        run: |
          exec > >(tee -a /tmp/e2e/passos.txt) 2>&1
          if [ "$ATUALIZAR" != "sim" ]; then echo "(sem atualizacao nesta rodada)"; exit 0; fi
          pkill -f "EliteTube.app/Contents/MacOS/EliteTube" || true; sleep 5; pkill -9 -f "EliteTube.app/Contents" || true; sleep 2
          /tmp/instalar-app.sh "$DMG2"
          echo "=== o python do motor de voz, DEPOIS de trocar o .app"
          /tmp/olhar-motor-voz.sh

      - name: Conferir os motores e reabrir o programa (como o Membro faz)
        run: |
          exec > >(tee -a /tmp/e2e/passos.txt) 2>&1
          U="$HOME/Library/Application Support/EliteTube"
          echo "=== onde ficaram os motores"; ls "$U"
          for M in "$U/motor-imagem" "$U/engine/motor-imagem"; do [ -d "$M" ] || continue; echo "--- $M"; ls "$M" "$M/python" 2>/dev/null | head -20
            ls "$M"/python/lib/python*/site-packages 2>/dev/null | grep -i -E "^(torch|diffusers|transformers)" | head
            cat "$M"/instalar-status-*.json 2>/dev/null | head -c 600; echo; done
          echo "=== reabrindo o EliteTube"
          /tmp/abrir-app.sh
          curl -s "http://127.0.0.1:47615/motor_img_status?motor=sd15"; echo
          curl -s http://127.0.0.1:47615/motor_clone_status | head -c 600; echo
          # a 4.0.4 conserta sozinha o motor de voz que a troca do .app quebrou: dar tempo
          for i in $(seq 1 60); do
            S=$(curl -s http://127.0.0.1:47615/motor_clone_status)
            echo "$S" | grep -q '"rodando":true' || break
            sleep 10
          done
          echo "depois da espera:"; curl -s http://127.0.0.1:47615/motor_clone_status | head -c 600; echo
          /tmp/olhar-motor-voz.sh

      - name: Gerar o video
        run: |
          exec > >(tee -a /tmp/e2e/passos.txt) 2>&1
          node /tmp/e2e/piloto.js gerar

      - name: Atualizar de novo por cima (como sera na proxima versao)
        run: |
          exec > >(tee -a /tmp/e2e/passos.txt) 2>&1
          echo "=================== SEGUNDA ATUALIZACAO ==================="
          echo "=== antes: os motores consertados"
          /tmp/olhar-motor-voz.sh; /tmp/olhar-motor-imagem.sh
          pkill -f "EliteTube.app/Contents/MacOS/EliteTube" || true; sleep 5; pkill -9 -f "EliteTube.app/Contents" || true; sleep 2
          /tmp/instalar-app.sh "$DMG2"
          echo "=== depois de trocar o .app de novo (TEM de continuar IMPORTA OK / TORCH OK, de dentro da pasta do motor)"
          /tmp/olhar-motor-voz.sh; /tmp/olhar-motor-imagem.sh
          /tmp/abrir-app.sh
          curl -s http://127.0.0.1:47615/motor_clone_status | head -c 400; echo
          curl -s "http://127.0.0.1:47615/motor_img_status?motor=sd15"; echo
          echo "MARCA-SEGUNDA-GERACAO $(date -u +%Y-%m-%dT%H:%M:%S)"

      - name: Gerar de novo depois da segunda atualizacao (sem conserto nenhum)
        run: |
          exec > >(tee -a /tmp/e2e/passos.txt) 2>&1
          node /tmp/e2e/piloto.js gerar

      - name: Registro do programa (elitetube.log)
        if: always()
        run: |
          U="$HOME/Library/Application Support/EliteTube"
          ls -la "$U" "$U/engine/saida" 2>/dev/null || true
          cp "$U"/elitetube.log* /tmp/e2e/ 2>/dev/null || true
          cp /tmp/app.out /tmp/e2e/ 2>/dev/null || true
          cp "$U/engine/saida/elitetube-demo.mp4" /tmp/e2e/ 2>/dev/null || true
          echo "================ elitetube.log (ultimas 300 linhas) ================"
          tail -n 300 "$U/elitetube.log" 2>/dev/null || echo "(sem elitetube.log)"
          echo "================ saida do aplicativo (ultimas 60) ================"
          tail -n 60 /tmp/app.out 2>/dev/null || true

      - name: Publicar o diagnostico (cifrado)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/diag.pub <<'PUB'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAoQBImszni4X5iViUUnr7
          lENeNgF3BfSZEwduEW23X5gzq5fiIA1jBkWPdh4F04akyAQ+woBDC6PDU9t5ZZpH
          P3O0vFsWXc8wm20LlnwrpSQANkA5mrKijMqHzyLMKN72BvJJ8/URowoI18Ua+W2l
          lYKfVkGx++sXjNvLyS9KNPwwrSdU0V3dfYbF1CcV5zBt6TuPIvMPGkIh+XgZcRwo
          RiMFexxYR7J4iFRR4js+EIaDxu2riXp48EhQa+IGgHYi6tDUvkxg2x2rx+tHg9fA
          k1DQLyPV/4WfMNsc8mot/k5Hv/WaT44m9ltObVy6idNQ73YUv7ArihsplzzPSU69
          4CGy/oKfsra6RO2dJaQUeMyidqOL1PKpf2lBR6EospGBB54WJs9UrZwvuDt3QqYt
          6FFoqGElqnAISRLP6QD/+TId/EXY5OrWoBQzGor/fehiOyNWiB0eXiND5fkSGqWJ
          AMpNKu8K4ZsyNug37uZuk/yE052pILnpYdydbOHYsiFnAgMBAAE=
          -----END PUBLIC KEY-----
          PUB
          cd /tmp && tar czf diag.tar.gz e2e
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -md sha256 -salt -in diag.tar.gz -out diagnostico.bin -pass file:k.txt
          openssl rsautl -encrypt -pubin -inkey diag.pub -in k.txt -out chave.bin
          rm -f k.txt
          T=diagnostico-elitetube-mac
          gh release view "$T" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$T" -R "$GITHUB_REPOSITORY" --title "Diagnostico (cifrado)" --notes "Saida cifrada do teste do EliteTube no Mac. Temporario."
          mv diagnostico.bin "diagnostico-$CENARIO-$GITHUB_RUN_NUMBER.bin"; mv chave.bin "chave-$CENARIO-$GITHUB_RUN_NUMBER.bin"
          gh release upload "$T" "diagnostico-$CENARIO-$GITHUB_RUN_NUMBER.bin" "chave-$CENARIO-$GITHUB_RUN_NUMBER.bin" -R "$GITHUB_REPOSITORY" --clobber
          echo "publicado: run $GITHUB_RUN_ID"
